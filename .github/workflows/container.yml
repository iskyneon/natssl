name: container

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', 'docker/**', '.dockerignore', 'tests/smoke_container.py', '.github/workflows/container.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  master-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NATSSL_TEST_IMAGE: natssl-master-smoke:local
      NATSSL_TEST_BINARY: /tmp/natssl-client
    steps:
      - name: Validate release version
        if: github.event_name != 'pull_request'
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true

      - name: Verify master-only policy and build native test client
        run: |
          CGO_ENABLED=0 go test -tags=masteronly ./...
          CGO_ENABLED=0 go build -o "$NATSSL_TEST_BINARY" .

      - name: Set image metadata
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'version=dev' >> "$GITHUB_OUTPUT"
          else
            echo "version=$RELEASE_TAG-oss" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build local amd64 smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.NATSSL_TEST_IMAGE }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise container master with a real native client
        run: python3 tests/smoke_container.py

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-platform master image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ env.RELEASE_TAG }}
            ${{ steps.metadata.outputs.image }}:${{ env.RELEASE_TAG }}-oss
            ${{ steps.metadata.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published platforms
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw > /tmp/natssl-image.json
          python3 - <<'PY'
          import json
          with open('/tmp/natssl-image.json') as f:
              manifests = json.load(f)['manifests']
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifests}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
