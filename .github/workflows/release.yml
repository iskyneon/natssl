name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true

      - name: Verify dependencies and run CI
        run: |
          go mod download
          go mod verify
          make ci

      - name: Build binaries and source archive
        shell: bash
        run: |
          VERSION="$RELEASE_TAG-oss" ./build.sh
          git archive --format=tar.gz --prefix=natssl/ \
            --output="dist/natssl-src-$RELEASE_TAG.tar.gz" HEAD
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Prepare draft release
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft > /tmp/natssl-release.json; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "natssl $RELEASE_TAG" --generate-notes
            gh release view "$RELEASE_TAG" --json isDraft > /tmp/natssl-release.json
          fi
          python3 - <<'PY'
          import json
          with open('/tmp/natssl-release.json') as f:
              if not json.load(f)['isDraft']:
                  raise SystemExit('Refusing to overwrite an already published release')
          PY

      - name: Upload and verify release assets
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          mkdir /tmp/natssl-release-download
          gh release download "$RELEASE_TAG" --dir /tmp/natssl-release-download
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {p.name: hashlib.sha256(p.read_bytes()).digest() for p in Path('dist').iterdir() if p.is_file()}
          actual = {p.name: hashlib.sha256(p.read_bytes()).digest() for p in Path('/tmp/natssl-release-download').iterdir() if p.is_file()}
          if len(expected) != 6 or actual != expected:
              raise SystemExit('Uploaded release assets do not match the verified local build')
          PY
          (cd /tmp/natssl-release-download && sha256sum -c SHA256SUMS.txt)

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
