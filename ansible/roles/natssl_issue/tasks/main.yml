---
- name: Validate per-client issuance options
  ansible.builtin.assert:
    that:
      - groups['natssl_master'] | default([]) | length == 1
      - natssl_client_cert_subject in ['ip', 'hostname', 'both']

- name: Resolve delegated master paths
  ansible.builtin.set_fact:
    _natssl_master: "{{ groups['natssl_master'][0] }}"

- name: Check master Root CA
  ansible.builtin.stat:
    path: "{{ hostvars[groups['natssl_master'][0]].natssl_data_dir }}/root-ca.crt"
  delegate_to: "{{ groups['natssl_master'][0] }}"
  register: _natssl_ca

- name: Require bootstrapped master
  ansible.builtin.assert:
    that: _natssl_ca.stat.exists
    fail_msg: Deploy the native master before issuing certificates.

- name: Compute canonical certificate subjects
  ansible.builtin.set_fact:
    _natssl_subjects: >-
      {{ (([ansible_host | default(inventory_hostname)] if natssl_client_cert_subject in ['ip', 'both'] else [])
          + ([inventory_hostname] if natssl_client_cert_subject in ['hostname', 'both'] and '.' in inventory_hostname else []))
          | map('natssl_subject') | unique | list }}

- name: Require at least one issuable subject
  ansible.builtin.assert:
    that: _natssl_subjects | length > 0
    fail_msg: Use an IP or a dotted DNS name; dot-less inventory names are not issuable.

- name: Issue or rotate on the native master
  ansible.builtin.command:
    argv:
      - "{{ hostvars[groups['natssl_master'][0]].natssl_bin }}"
      - --mode=master
      - "{{ '--reissue' if natssl_reissue | bool else '--issue' }}"
      - "{{ item }}"
      - "--config={{ hostvars[groups['natssl_master'][0]].natssl_conf_file }}"
    creates: "{{ omit if natssl_reissue | bool else hostvars[groups['natssl_master'][0]].natssl_data_dir ~ '/issued/' ~ (item | natssl_cert_name) ~ '.crt' }}"
  loop: "{{ _natssl_subjects }}"
  delegate_to: "{{ groups['natssl_master'][0] }}"

- name: Read certificate and private key from master
  ansible.builtin.slurp:
    src: "{{ hostvars[groups['natssl_master'][0]].natssl_data_dir }}/issued/{{ item.0 | natssl_cert_name }}{{ item.1 }}"
  loop: "{{ _natssl_subjects | product(['.crt', '.key']) | list }}"
  delegate_to: "{{ groups['natssl_master'][0] }}"
  register: _natssl_files
  when: natssl_deliver_certs | bool
  no_log: true

- name: Create client certificate directory
  ansible.builtin.file:
    path: "{{ natssl_client_issued_dir }}"
    state: directory
    owner: "{{ natssl_file_owner }}"
    group: "{{ natssl_file_group }}"
    mode: '0700'
  when: natssl_deliver_certs | bool

- name: Deliver certificates and private keys
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ natssl_client_issued_dir }}/{{ item.item.0 | natssl_cert_name }}{{ item.item.1 }}"
    owner: "{{ natssl_file_owner }}"
    group: "{{ natssl_file_group }}"
    mode: "{{ '0600' if item.item.1 == '.key' else '0644' }}"
  loop: "{{ _natssl_files.results | default([]) }}"
  when:
    - natssl_deliver_certs | bool
    - not (item.skipped | default(false))
  no_log: true
  diff: false
