---
# 1) Install the binary, create directories and provision dependencies on all hosts.
- name: NATSSL — common provisioning
  hosts: natssl_master:natssl_clients
  become: true
  pre_tasks:
    - name: Validate the single-master topology
      ansible.builtin.assert:
        that:
          - groups['natssl_master'] | default([]) | length == 1
          - groups['natssl_master'] | intersect(groups['natssl_clients'] | default([])) | length == 0
      run_once: true
      tags: always
  roles:
    - natssl_common

# 2) Master: configure -> bootstrap -> start service -> export fingerprint and recovery public key.
- name: NATSSL — master
  hosts: natssl_master
  become: true
  vars_files: [group_vars/vault.yml]
  roles:
    - natssl_master

# 3) Clients: use facts gathered from the master (hostvars), then enroll.
- name: NATSSL — clients
  hosts: natssl_clients
  become: true
  vars_files: [group_vars/vault.yml]
  roles:
    - natssl_client

# 4) OPTIONAL, tag-gated: issue a certificate on the master for each client
#    and deliver the .crt/.key files to that client. Skipped during normal runs.
#    serial: 1 processes hosts in [natssl_clients] sequentially, one at a time.
#    To reissue (revoke + issue), pass: -e natssl_reissue=true
- name: NATSSL — issue per-client certificates on the master
  hosts: natssl_clients
  become: true
  gather_facts: false
  serial: 1
  tags:
    - never
    - issue_client_certs
  roles:
    - natssl_issue

