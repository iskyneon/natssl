---
natssl_release_tag: "1.0.10"
natssl_pkg_version: "{{ natssl_release_tag }}-oss"
natssl_download_base: "https://github.com/iskyneon/natssl/releases/download"
natssl_bin: "/usr/local/bin/natssl"
natssl_conf_dir: "/etc/natssl"
natssl_conf_file: "{{ natssl_conf_dir }}/config.yaml"
natssl_data_dir: "/var/lib/natssl"
natssl_acme_listen: ":443"
natssl_mgmt_listen: ":8443"
natssl_client_mgmt_listen: ":8443"
natssl_server_names: []
natssl_pull_interval: "1h"
natssl_ping_interval: "5m"
natssl_client_networks:
  - "192.168.10.0/24"

# Native systemd deployment is the default. These switches also support
# externally managed processes and isolated deployment tests.
natssl_manage_services: true
natssl_manage_packages: true
natssl_install_binary: true
natssl_file_owner: root
natssl_file_group: root
natssl_install_trust: true
natssl_show_recovery_seed: true
