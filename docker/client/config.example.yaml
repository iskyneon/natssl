mode: client
install_trust: false # export the Root CA to the host explicitly if needed
data_dir: /var/lib/natssl
master_address: "192.168.10.5"
# Optional when the master control plane uses a custom port:
# master_mgmt_address: "192.168.10.5:8443"
master_fingerprint: "REPLACE_WITH_ROOT_CA_SHA256"
recovery_public_key: "REPLACE_WITH_RECOVERY_PUBLIC_KEY"
enrollment_token: "REPLACE_WITH_ENROLLMENT_TOKEN"
listen:
  mgmt: ":8443" # signed migration announcements only; no cache/CRL push
pull_interval: 1h
ping_interval: 5m
