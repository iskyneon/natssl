services:
  natssl-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${NATSSL_VERSION:-1.0.11-oss}
    image: ${NATSSL_IMAGE:-ghcr.io/iskyneon/natssl:1.0.11}
    user: "${NATSSL_UID:-1000}:${NATSSL_GID:-1000}"
    command: ["--mode=master", "--config=/etc/natssl/config.yaml"]
    ports:
      - "${NATSSL_BIND:-0.0.0.0}:${ACME_PORT:-443}:9443"
      - "${NATSSL_BIND:-0.0.0.0}:${MGMT_PORT:-8443}:8443"
    volumes:
      # Bootstrap updates recovery_public_key through an atomic rename.
      - ./master:/etc/natssl
      - ./data:/var/lib/natssl
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/var/lib/natssl/root-ca.crt", "https://127.0.0.1:9443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
