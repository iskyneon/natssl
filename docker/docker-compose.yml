services:
  natssl-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${NATSSL_VERSION:-1.0.10-oss}
    image: ${NATSSL_IMAGE:-ghcr.io/iskyneon/natssl:1.0.10}
    user: "${NATSSL_UID:-1000}:${NATSSL_GID:-1000}"
    command: ["--config=/etc/natssl/config.yaml"]
    ports:
      - "${MGMT_BIND:-127.0.0.1}:${MGMT_PORT:-8443}:8443"
    volumes:
      # Mount the directory: signed migration updates the config atomically.
      - ./client:/etc/natssl
      - ./data:/var/lib/natssl
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/natssl/network-cache.enc && openssl verify -purpose sslclient -CAfile /var/lib/natssl/root-ca.crt /var/lib/natssl/client-identity.crt >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
